<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;font-family:'Manrope',system-ui,sans-serif;}
  a{color:oklch(70% 0.19 45);} a:hover{color:oklch(75% 0.19 45);}
</style>
</helmet>
<div style="display:flex;align-items:flex-end;justify-content:space-around;padding:10px 6px 16px;background:oklch(24% 0.04 200);border-top:1px solid oklch(38% 0.045 200 / 0.5);box-sizing:border-box;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{feedColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <span style="font-size:10px;font-weight:700;color:{{feedColor}};">Feed</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{rankingColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h2a2 2 0 0 1 0 4h-1"/><path d="M7 5H5a2 2 0 0 0 0 4h1"/></svg>
    <span style="font-size:10px;font-weight:700;color:{{rankingColor}};">Ranking</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px;margin-top:-30px;">
    <div style="width:52px;height:52px;border-radius:50%;background:oklch(70% 0.19 45);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 18px oklch(70% 0.19 45 / 0.45);border:3px solid oklch(24% 0.04 200);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <span style="font-size:10px;font-weight:700;color:oklch(70% 0.19 45);">Registrar</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{arenasColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span style="font-size:10px;font-weight:700;color:{{arenasColor}};">Arenas</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{profileColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    <span style="font-size:10px;font-weight:700;color:{{profileColor}};">Perfil</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"active":{"editor":"enum","default":"feed","options":["feed","ranking","record","arenas","profile"]}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'feed';
    const on = 'oklch(70% 0.19 45)';
    const off = 'oklch(58% 0.03 195)';
    return {
      feedColor: a === 'feed' ? on : off,
      rankingColor: a === 'ranking' ? on : off,
      arenasColor: a === 'arenas' ? on : off,
      profileColor: a === 'profile' ? on : off,
    };
  }
}
</script>
</body>
</html>
