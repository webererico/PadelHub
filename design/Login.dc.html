<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:oklch(20% 0.035 200);color:oklch(97% 0.01 95);}
  h1,h2,.disp{font-family:'Space Grotesk',system-ui,sans-serif;}
  a{color:oklch(70% 0.19 45);text-decoration:none;} a:hover{color:oklch(76% 0.19 45);}
  button{font-family:inherit;}
</style>
</helmet>
<div style="width:390px;min-height:844px;position:relative;overflow:hidden;background:oklch(20% 0.035 200);box-sizing:border-box;display:flex;flex-direction:column;">

  <div style="position:relative;height:472px;background:radial-gradient(120% 90% at 20% -10%, oklch(32% 0.06 195) 0%, oklch(20% 0.035 200) 62%);overflow:hidden;">
    <svg width="390" height="472" viewBox="0 0 390 472" style="position:absolute;inset:0;">
      <rect x="55" y="70" width="280" height="360" rx="14" fill="none" stroke="oklch(45% 0.05 195)" stroke-width="2"/>
      <line x1="55" y1="250" x2="335" y2="250" stroke="oklch(45% 0.05 195)" stroke-width="2"/>
      <rect x="55" y="238" width="280" height="24" fill="oklch(24% 0.045 200)" stroke="oklch(45% 0.05 195)" stroke-width="1.5"/>
      <line x1="195" y1="70" x2="195" y2="430" stroke="oklch(38% 0.045 195)" stroke-width="1.5" stroke-dasharray="4 6"/>
      <rect x="55" y="70" width="280" height="360" rx="14" fill="none" stroke="oklch(70% 0.19 45 / 0.35)" stroke-width="1"/>
    </svg>
    <div style="position:absolute;width:170px;height:170px;border-radius:50%;background:oklch(70% 0.19 45 / 0.35);filter:blur(50px);top:-40px;right:-50px;"></div>
    <div style="position:absolute;left:0;right:0;top:60px;display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="display:flex;align-items:center;gap:9px;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="oklch(70% 0.19 45)"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18" stroke="oklch(20% 0.035 200)" stroke-width="1.4" fill="none"/><path d="M6 8c2 2 10 2 12 0M6 16c2-2 10-2 12 0" stroke="oklch(20% 0.035 200)" stroke-width="1.4" fill="none"/></svg>
        <span class="disp" style="font-size:24px;font-weight:700;letter-spacing:-0.02em;">PadelHub</span>
      </div>
      <span style="font-size:13px;font-weight:600;color:oklch(78% 0.03 195);letter-spacing:.04em;text-transform:uppercase;">O Strava do Padel</span>
    </div>
    <div style="position:absolute;left:120px;top:150px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 32% 30%, oklch(85% 0.19 120), oklch(65% 0.17 120));box-shadow:0 8px 16px oklch(15% 0.02 200 / 0.5);"></div>
  </div>

  <div style="flex:1;background:oklch(24% 0.04 200);border-radius:28px 28px 0 0;margin-top:-28px;position:relative;padding:32px 26px 30px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px;">
    <div>
      <h1 class="disp" style="margin:0 0 8px;font-size:26px;font-weight:700;letter-spacing:-0.01em;">Bem-vindo de volta</h1>
      <p style="margin:0;font-size:14px;line-height:1.5;color:oklch(72% 0.03 195);">Registre placares, acompanhe seu rating e dispute o topo do ranking da sua arena.</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;">
      <button style="display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:14px;border:none;background:oklch(97% 0.01 95);color:oklch(22% 0.02 200);font-size:15px;font-weight:700;cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/></svg>
        Continuar com Google
      </button>
      <button style="display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:14px;border:none;background:oklch(70% 0.19 45);color:oklch(99% 0.01 95);font-size:15px;font-weight:700;cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        Continuar com e-mail
      </button>
    </div>

    <div style="display:flex;align-items:center;gap:10px;">
      <div style="flex:1;height:1px;background:oklch(38% 0.04 200);"></div>
      <span style="font-size:11px;color:oklch(55% 0.03 195);font-weight:600;">OU</span>
      <div style="flex:1;height:1px;background:oklch(38% 0.04 200);"></div>
    </div>

    <p style="margin:0;text-align:center;font-size:13.5px;color:oklch(72% 0.03 195);">Não tem conta? <a href="#">Criar conta grátis</a></p>

    <p style="margin:8px 0 0;text-align:center;font-size:11px;line-height:1.5;color:oklch(48% 0.02 195);">Ao continuar, você aceita os Termos de Uso e a Política de Privacidade do PadelHub.</p>
  </div>
</div>
</x-dc>
</body>
</html>
