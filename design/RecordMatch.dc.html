<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:oklch(20% 0.035 200);color:oklch(97% 0.01 95);}
  h1,h2,.disp{font-family:'Space Grotesk',system-ui,sans-serif;}
  .card{background:oklch(24% 0.04 200);border-radius:16px;border:1px solid oklch(32% 0.04 200 / 0.6);}
  .label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:oklch(58% 0.03 195);}
</style>
</helmet>
<div style="width:390px;background:oklch(20% 0.035 200);box-sizing:border-box;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;gap:14px;padding:18px 20px 14px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(90% 0.01 95)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <h1 class="disp" style="margin:0;font-size:18px;font-weight:700;flex:1;">Registrar Partida</h1>
    <span style="font-size:13px;font-weight:700;color:oklch(58% 0.03 195);">Salvar</span>
  </div>

  <div style="padding:0 20px 20px;display:flex;flex-direction:column;gap:22px;">

    <div>
      <div class="label" style="margin-bottom:10px;">Formato</div>
      <div style="display:flex;gap:8px;">
        <div style="flex:1;text-align:center;padding:10px 0;border-radius:12px;background:oklch(70% 0.19 45);font-size:13px;font-weight:700;">Amistosa</div>
        <div style="flex:1;text-align:center;padding:10px 0;border-radius:12px;background:oklch(28% 0.045 200);font-size:13px;font-weight:700;color:oklch(72% 0.03 195);">Torneio</div>
        <div style="flex:1;text-align:center;padding:10px 0;border-radius:12px;background:oklch(28% 0.045 200);font-size:13px;font-weight:700;color:oklch(72% 0.03 195);">Americano</div>
      </div>
    </div>

    <div>
      <div class="label" style="margin-bottom:10px;">Sua dupla</div>
      <div style="display:flex;gap:10px;">
        <div class="card" style="flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;">
          <div style="width:34px;height:34px;border-radius:50%;background:oklch(45% 0.09 195);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;">RC</div>
          <span style="font-size:13px;font-weight:700;">Você</span>
        </div>
        <div class="card" style="flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-style:dashed;">
          <div style="width:34px;height:34px;border-radius:50%;background:oklch(30% 0.04 200);display:flex;align-items:center;justify-content:center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(70% 0.19 45)" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          </div>
          <span style="font-size:13px;font-weight:600;color:oklch(70% 0.19 45);">Parceiro</span>
        </div>
      </div>
    </div>

    <div>
      <div class="label" style="margin-bottom:10px;">Adversários</div>
      <div style="display:flex;gap:10px;">
        <div class="card" style="flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;">
          <div style="width:34px;height:34px;border-radius:50%;background:oklch(60% 0.15 45);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;">FL</div>
          <span style="font-size:13px;font-weight:700;">Fernanda Lima</span>
        </div>
        <div class="card" style="flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;">
          <div style="width:34px;height:34px;border-radius:50%;background:oklch(55% 0.13 20);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;">TR</div>
          <span style="font-size:13px;font-weight:700;">Thiago Rocha</span>
        </div>
      </div>
    </div>

    <div>
      <div class="label" style="margin-bottom:10px;">Placar por set</div>
      <div style="display:flex;flex-direction:column;gap:10px;">

        <div class="card" style="display:flex;align-items:center;padding:14px 16px;">
          <span style="font-size:12px;font-weight:700;color:oklch(58% 0.03 195);width:44px;">SET 1</span>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:22px;">
            <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(58% 0.03 195)" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg>
              <span class="disp" style="font-size:30px;font-weight:700;color:oklch(70% 0.19 45);">6</span>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(58% 0.03 195)" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <span class="disp" style="font-size:20px;color:oklch(45% 0.03 195);">×</span>
            <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(58% 0.03 195)" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg>
              <span class="disp" style="font-size:30px;font-weight:700;">4</span>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(58% 0.03 195)" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
        </div>

        <div class="card" style="display:flex;align-items:center;padding:14px 16px;">
          <span style="font-size:12px;font-weight:700;color:oklch(58% 0.03 195);width:44px;">SET 2</span>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:22px;">
            <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(58% 0.03 195)" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg>
              <span class="disp" style="font-size:30px;font-weight:700;">3</span>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(58% 0.03 195)" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <span class="disp" style="font-size:20px;color:oklch(45% 0.03 195);">×</span>
            <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(58% 0.03 195)" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg>
              <span class="disp" style="font-size:30px;font-weight:700;color:oklch(70% 0.19 45);">6</span>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(58% 0.03 195)" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
        </div>

        <div class="card" style="display:flex;align-items:center;padding:14px 16px;border-color:oklch(70% 0.19 45 / 0.4);">
          <span style="font-size:11px;font-weight:700;color:oklch(70% 0.19 45);width:44px;line-height:1.3;">SUPER<br/>TIE-BREAK</span>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:22px;">
            <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(58% 0.03 195)" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg>
              <span class="disp" style="font-size:30px;font-weight:700;color:oklch(70% 0.19 45);">10</span>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(58% 0.03 195)" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <span class="disp" style="font-size:20px;color:oklch(45% 0.03 195);">×</span>
            <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(58% 0.03 195)" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg>
              <span class="disp" style="font-size:30px;font-weight:700;">8</span>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(58% 0.03 195)" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div style="display:flex;align-items:flex-start;gap:10px;padding:14px;background:oklch(28% 0.045 200);border-radius:12px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(70% 0.19 45)" stroke-width="2" style="flex-shrink:0;margin-top:1px;"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
      <p style="margin:0;font-size:12.5px;line-height:1.5;color:oklch(78% 0.03 195);">Validação cruzada: o placar só entra para o ranking depois que ao menos um adversário confirmar.</p>
    </div>

    <button style="width:100%;height:54px;border:none;border-radius:14px;background:oklch(70% 0.19 45);color:white;font-size:15px;font-weight:700;font-family:inherit;">Enviar para confirmação</button>

  </div>
</div>
</x-dc>
</body>
</html>
