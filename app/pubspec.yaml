name: padelhub
description: PadelHub — o Strava do Padel. Placares, ranking ELO e rede social para padelistas.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Firebase — autenticação (email/senha + Google)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  # Estado e navegação
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Backend (Cloud Functions -> Cloud SQL/Postgres)
  http: ^1.2.2

  # UI
  google_fonts: ^8.2.1
  fl_chart: ^0.69.0
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
